<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecuación Cuadrática</title>
</head>

<body>
    <!--Titulo principal-->
    <div class="title">
        <h1>Ecuación cuadrática</h1>
    </div>
    <!--contenedor para el numero a-->
    <div>
        <label for="num1">Ingrese el primer número (a)</label>
        <input type="number" id="num1">
    </div>
    <!--contenedor para el numero b-->
    <div>
        <label for="num2">Ingrese el segundo número (b)</label>
        <input type="number" id="num2">
    </div>
    <!--contenedor para el numero c-->
    <div>
        <label for="num3">Ingrese el tercer número (c)</label>
        <input type="number" id="num3">
    </div>

    <!--Para que el boton calcule-->
    <div>
        <button onclick="calcular()">Calcular operación</button>
    </div>

    <!--Para que se refleje el resultado-->
    <div id="resultado"></div>
    
    <!--JavaScript-->
    <script src="JavaScript/operacion.js"></script>
</body>

</html>
